esphome:
  name: sevenseg-clock
  friendly_name: sevenseg-clock
  includes:
    - sevenseg_clock.h

esp8266:
  board: d1_mini

# Enable logging
logger:
  level: INFO
  baud_rate: 0

# Enable Home Assistant API
api:
  services:
    - service: set_pixel
      variables:
        index_start: int
        index_end: int
        r: int
        g: int
        b: int
      then:
        - light.addressable_set:
            id: led_strip
            range_from: !lambda "return index_start;"
            range_to: !lambda "return index_end;"
            red: !lambda "return r;"
            green: !lambda "return g;"
            blue: !lambda "return b;"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password


# Example configuration entry
time:
  - platform: homeassistant
    id: homeassistant_time

globals:
  - id: timer_seconds
    type: int
    restore_value: no
    initial_value: '0'


# Text entity you can set from Home Assistant
text:
  - platform: template
    name: "7-Segment Display Text"
    id: display_text
    optimistic: true
    min_length: 0
    max_length: 4
    mode: text
    initial_value: "1234"


text_sensor:
  - platform: homeassistant
    id: ha_timer_remaining
    entity_id: timer.led_timer
    attribute: remaining
    internal: true
    on_value:
      then:
        - lambda: |-
            int h = 0, m = 0, s = 0;
            if (sscanf(x.c_str(), "%d:%d:%d", &h, &m, &s) == 3) {
              id(timer_seconds) = h * 3600 + m * 60 + s;
            }

  - platform: homeassistant
    id: ha_timer_state
    entity_id: timer.led_timer
    internal: true

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (id(timer_seconds) > 0 && id(ha_timer_state).state == "active") {
            id(timer_seconds)--;
          }

number:
  - platform: template
    name: "LED Index"
    id: led_index
    optimistic: true
    min_value: 0
    max_value: 60   # 0..60 = 61 LEDs
    step: 1
    initial_value: 0

# Example configuration entry
light:
  - platform: neopixelbus
    type: GRB
    variant: ws2812
    pin: D1
    num_leds: 61
    name: "NeoPixel Light"
    id: led_strip
    default_transition_length: 0s
    effects:

      - addressable_lambda:
          name: "Manual"
          update_interval: 1000ms
          lambda: |-
            // Manual mode: do nothing here
            // The LEDs stay as set by API or other actions.

      - addressable_lambda:
          name: "Index LED"
          update_interval: 200ms
          lambda: |-
            // turn all LEDs off first
            it.all() = esphome::Color::BLACK;

            // read index from number entity
            int index = (int) id(led_index).state;
            int max_index = it.size() - 1;

            if (index < 0) index = 0;
            if (index > max_index) index = max_index;

            // use current light color from HA
            esphome::Color col = current_color;

            // set only that one LED
            it[index] = col;

      - addressable_lambda:
          name: "Clock - static"
          update_interval: 500ms
          lambda: |-
            using namespace sevenseg;

            clear_all(it);

            auto now = id(homeassistant_time).now();
            int digits[4];
            digits[0] = now.hour / 10;
            digits[1] = now.hour % 10;
            digits[2] = now.minute / 10;
            digits[3] = now.minute % 10;

            esphome::Color base = current_color;

            draw_colon(it, base);
            for (int i = 0; i < 4; i++) {
              draw_digit(it, i, digits[i], base);
            }

      - addressable_lambda:
          name: "Clock - digit rainbow"
          update_interval: 1000ms
          lambda: |-
            using namespace sevenseg;

            clear_all(it);

            auto now = id(homeassistant_time).now();
            int digits[4];
            digits[0] = now.hour / 10;
            digits[1] = now.hour % 10;
            digits[2] = now.minute / 10;
            digits[3] = now.minute % 10;

            uint32_t t = now.second;  // 0..59

            for (int i = 0; i < 4; i++) {
              uint8_t step = (t + i) % 6;
              esphome::Color col;
              switch (step) {
                case 0: col = esphome::Color(255, 0, 0); break;    // red
                case 1: col = esphome::Color(0, 255, 0); break;    // green
                case 2: col = esphome::Color(0, 0, 255); break;    // blue
                case 3: col = esphome::Color(255, 255, 0); break;  // yellow
                case 4: col = esphome::Color(255, 0, 255); break;  // magenta
                default: col = esphome::Color(0, 255, 255); break; // cyan
              }
              draw_digit(it, i, digits[i], col);
            }

            // Colon langsam mitwandern lassen
            uint8_t colon_step = (t / 2) % 6;
            esphome::Color colon_col;
            switch (colon_step) {
              case 0: colon_col = esphome::Color(255, 0, 0); break;
              case 1: colon_col = esphome::Color(0, 255, 0); break;
              case 2: colon_col = esphome::Color(0, 0, 255); break;
              case 3: colon_col = esphome::Color(255, 255, 0); break;
              case 4: colon_col = esphome::Color(255, 0, 255); break;
              default: colon_col = esphome::Color(0, 255, 255); break;
            }
            draw_colon(it, colon_col);

      - addressable_lambda:
          name: "Clock - digit rainbow old"
          update_interval: 80ms
          lambda: |-
            using namespace sevenseg;

            clear_all(it);

            auto now = id(homeassistant_time).now();
            int digits[4];
            digits[0] = now.hour / 10;
            digits[1] = now.hour % 10;
            digits[2] = now.minute / 10;
            digits[3] = now.minute % 10;

            uint32_t t = millis() / 120;

            for (int i = 0; i < 4; i++) {
              // simple color wheel with 6 colors
              uint8_t step = (t + i) % 6;
              esphome::Color col;
              switch (step) {
                case 0: col = esphome::Color(255, 0, 0); break;    // red
                case 1: col = esphome::Color(0, 255, 0); break;    // green
                case 2: col = esphome::Color(0, 0, 255); break;    // blue
                case 3: col = esphome::Color(255, 255, 0); break;  // yellow
                case 4: col = esphome::Color(255, 0, 255); break;  // magenta
                default: col = esphome::Color(0, 255, 255); break; // cyan
              }
              draw_digit(it, i, digits[i], col);
            }

            // Colon slowly cycles through the same wheel
            uint8_t colon_step = (t / 2) % 6;
            esphome::Color colon_col;
            switch (colon_step) {
              case 0: colon_col = esphome::Color(255, 0, 0); break;
              case 1: colon_col = esphome::Color(0, 255, 0); break;
              case 2: colon_col = esphome::Color(0, 0, 255); break;
              case 3: colon_col = esphome::Color(255, 255, 0); break;
              case 4: colon_col = esphome::Color(255, 0, 255); break;
              default: colon_col = esphome::Color(0, 255, 255); break;
            }
            draw_colon(it, colon_col);

      - addressable_lambda:
          name: "Clock - pulse"
          update_interval: 40ms
          lambda: |-
            using namespace sevenseg;

            clear_all(it);

            auto now = id(homeassistant_time).now();
            int digits[4];
            digits[0] = now.hour / 10;
            digits[1] = now.hour % 10;
            digits[2] = now.minute / 10;
            digits[3] = now.minute % 10;

            // Triangle wave for brightness (0.3 .. 1.0)
            uint32_t t = millis() / 20;
            uint8_t phase = t % 512;  // 0..511
            float factor;
            if (phase < 256) {
              factor = 0.3f + (0.7f * phase / 255.0f);
            } else {
              factor = 0.3f + (0.7f * (511 - phase) / 255.0f);
            }

            esphome::Color base = current_color;
            esphome::Color col(
              static_cast<uint8_t>(base.r * factor),
              static_cast<uint8_t>(base.g * factor),
              static_cast<uint8_t>(base.b * factor)
            );

            draw_colon(it, col);
            for (int i = 0; i < 4; i++) {
              draw_digit(it, i, digits[i], col);
            }

      - addressable_lambda:
          name: "Text Display"
          update_interval: 200ms
          lambda: |-
            using namespace sevenseg;

            clear_all(it);

            std::string s = id(display_text).state;

            // Right-align to 4 characters, pad with spaces
            if (s.size() > 4) {
              s = s.substr(s.size() - 4, 4);
            } else if (s.size() < 4) {
              s = std::string(4 - s.size(), ' ') + s;
            }

            esphome::Color col = current_color;

            for (int i = 0; i < 4; i++) {
              char ch = s[i];
              if (ch >= '0' && ch <= '9') {
                int val = ch - '0';
                draw_digit(it, i, val, col);
              } else {
                // unsupported char => digit stays off
              }
            }

      - addressable_lambda:
          name: "Timer MM:SS"
          update_interval: 250ms
          lambda: |-
            using namespace sevenseg;

            clear_all(it);

            int total_seconds = id(timer_seconds);
            if (total_seconds <= 0) {
              return;
            }

            int display_minutes = total_seconds / 60;
            int display_seconds = total_seconds % 60;
            if (display_minutes > 99) display_minutes = 99;

            int digits[4];
            digits[0] = display_minutes / 10;
            digits[1] = display_minutes % 10;
            digits[2] = display_seconds / 10;
            digits[3] = display_seconds % 10;

            float ratio = 0.0f;
            if (total_seconds <= 1800) {
              ratio = total_seconds / 1800.0f;
              if (ratio < 0.0f) ratio = 0.0f;
              if (ratio > 1.0f) ratio = 1.0f;
            }

            uint8_t r = static_cast<uint8_t>((1.0f - ratio) * 255);
            uint8_t g = static_cast<uint8_t>(ratio * 255);
            esphome::Color col(r, g, 0);

            draw_colon(it, col);
            for (int i = 0; i < 4; i++) {
              draw_digit(it, i, digits[i], col);
            }

      - addressable_lambda:
          name: "Temperature from Text"
          update_interval: 500ms
          lambda: |-
            using namespace sevenseg;

            clear_all(it);

            std::string s = id(display_text).state;
            // Replace comma with dot for atof
            for (size_t i = 0; i < s.size(); i++) {
              if (s[i] == ',') s[i] = '.';
            }

            float temp = atof(s.c_str());
            int value10 = (int) roundf(temp * 10.0f);
            if (value10 < 0) value10 = 0;      // einfache Begrenzung
            if (value10 > 999) value10 = 999;  // max 99.9

            int tens   = (value10 / 100) % 10;
            int ones   = (value10 / 10)  % 10;
            int tenths =  value10        % 10;

            esphome::Color col = current_color;

            if (value10 >= 100) {
              draw_digit(it, 0, tens, col);
            }

            draw_digit(it, 1, ones, col);
            draw_digit(it, 2, tenths, col);
            it[31] = col;
            draw_degree(it, col);

      - addressable_lambda:
          name: "Running Light"
          update_interval: 40ms
          lambda: |-
            it.all() = esphome::Color::BLACK;

            uint16_t n = it.size();
            uint32_t t = millis() / 30;
            uint16_t pos = t % n;

            esphome::Color base = current_color;

            for (int offset = -3; offset <= 3; offset++) {
              int idx = (int) pos + offset;
              if (idx < 0) idx += n;
              if (idx >= n) idx -= n;

              float factor = 1.0f - (abs(offset) * 0.2f);
              if (factor < 0.0f) factor = 0.0f;

              it[idx] = esphome::Color(
                (uint8_t)(base.r * factor),
                (uint8_t)(base.g * factor),
                (uint8_t)(base.b * factor)
              );
            }
